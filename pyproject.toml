[project]
name = "beeos"
version = "0.1.0"
description = "beeOS - Business Fulfillment Operating System"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    # runtime/llm.py 在模块顶层 import httpx，是硬依赖。
    # 之前漏声明，本地 .venv 里碰巧装了所以一直没暴露；部署到干净
    # 环境时直接 ModuleNotFoundError 起不来。
    "httpx>=0.27",
    # 小票盒收 HEIC（iPhone 拍的），盒子在 read_receipt 里转 JPEG。
    # 硬依赖不是图省事：macOS 开发机有 sips 兜底，Linux 服务端没有，
    # 只靠 sips 的版本在开发机全绿、到服务端第一次投 HEIC 就履约中止。
    # 声明它，那条路才是所有环境都真跑过的那条。libheif 打包在 wheel 里。
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "setuptools>=61.0",
    "wheel",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# **这份清单必须跟磁盘上的包一一对应**：
# 少了 → 打包出来的 wheel 里没有那个包（装了也 import 不到）；
# 多了 → 指向一个不存在的目录（打包直接报错）。
# 它以前还写着 "boxes.modeling" 和 "beelines.*"——前者是改名之前的老名字，
# 后者那三个目录早就不存在了（beeline 搬进盒子了）。
packages = [
    "core",
    "boxes",
    "boxes.receipt",
    "boxes.learning_english",
    "boxes.learning_chinese",
    "boxes.learning_math",
    "boxes.learning_growth",
    "boxes.wms_analysis",
    "boxes.wms_design",
    "boxes.wms_development",
    "boxes.wms_ops",
    "boxes.wms_requirement",
    "boxes.wms_system",
    "boxes.wms_testing",
    "runtime",
    "kanban",
    "domains",
    "domains.wms",
    "domains.learning",
    "workshop",
    # **scripts 也要装**：装出来的环境里跑得动
    # `tests/test_chain_script.py`（它按仓根找 scripts/run_chain.py）
    # 和 `tests/test_new_box_scaffold.py`（它 import scripts.new_box）。
    # 漏了 → 装好的环境里这两个测试**在收集阶段就炸**，
    # 那是「装出来的包跑不了自己的测试」。
    "scripts",
    "tests",
    # **tests 的子包也是包**：漏了 → 装出来的环境里
    # `import tests.fixtures.sample_box` 直接 ModuleNotFoundError。
    "tests.fixtures",
    "tests.fixtures.sample_box",
]

[tool.setuptools.package-data]
# 每个包目录里的说明文档（盒子 README、模块 README）。
# 用通配键而不是逐个包写一遍——逐个写的话，新增一只盒子就多一行，
# 而漏掉的那一行 = 装出来的 wheel 里那只盒子没有说明书。
"*" = ["*.md"]
"boxes.wms_system" = ["baseline/*.json"]
"kanban" = ["vendor/*.js", "vendor/addons/environments/*.js"]
# 部署脚本：它是**运行产物的一部分**（不是文档）——
# 漏了它，装出来的环境里没有部署入口。
"scripts" = ["*.sh"]
# 夹具里的**图片和真值表**：小票语料 + 样例图。
# 漏了 → 装好的环境里票据相关的测试拿不到样本（不是「跳过」，是「报错」）。
# 这里写目录通配而不是逐个文件名：漏一个文件名 = 装好的环境里那条测试直接炸，
# 而「通配」让新增语料自动进包。
"tests.fixtures" = ["*.jpg", "*.heic", "receipts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
